[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsse-incident-data-pipeline"
version = "0.2.0"
description = "Reproducible construction of a balanced 400K English HSSE and security incident corpus."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shariar Imroze Khan"}]
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pandas>=2.2,<3",
]

[project.scripts]
hsse-data = "incident_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
